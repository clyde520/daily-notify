yaml
name: 每日信息推送

on:
  # 定时触发：每天早上9点（北京时间）
  schedule:
    - cron: '0 1 * * *'  # UTC时间1点 = 北京时间9点

  # 手动触发（用于测试）
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行信息搜集脚本
        env:
          # 通知配置
          NOTIFICATION_TYPE: ${{ secrets.NOTIFICATION_TYPE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}

          # 信息搜集配置
          WEATHER_CITY: ${{ secrets.WEATHER_CITY }}
          NEWS_KEYWORD: ${{ secrets.NEWS_KEYWORD }}
          STOCK_SYMBOL: ${{ secrets.STOCK_SYMBOL }}

        run: |
          python fetch_and_notify.py
